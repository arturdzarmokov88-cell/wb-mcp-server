services:
  wb-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DB_PATH: /data/wb.db
    volumes:
      # База с историей по дням (реклама, остатки, воронка) переживает обновления.
      - wb_data:/data
    expose:
      - "8080"

  # Caddy принимает HTTPS-запросы и сам получает сертификат Let's Encrypt.
  caddy:
    image: mirror.gcr.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wb-mcp

volumes:
  wb_data:
  caddy_data:
  caddy_config:
